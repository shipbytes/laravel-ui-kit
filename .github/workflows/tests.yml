name: Tests

on:
  push:
    branches: [main, master, staging, v0.1-l12-reset]
  pull_request:
    branches: [main, master, staging]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: PHP syntax check
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax-check every PHP file
        run: |
          set -e
          find src stubs tests -type f -name "*.php" -print0 \
            | xargs -0 -I {} php -l -n {} > /dev/null

  tests:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*']
        testbench: ['10.*']
        experimental: [false]
        include:
          # Laravel 13 leg — allowed to fail until the ecosystem
          # (testbench 11, Fortify, Spatie peers) fully lands.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
