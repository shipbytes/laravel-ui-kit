name: Tests

on:
  push:
    branches: [main, master, staging, v0.1-l12-reset]
  pull_request:
    branches: [main, master, staging]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: PHP syntax check
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax-check every PHP file
        run: |
          set -e
          find src stubs tests -type f -name "*.php" -print0 \
            | xargs -0 -I {} php -l -n {} > /dev/null

  static:
    runs-on: ubuntu-latest
    needs: lint
    name: Pint + Larastan
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Pint (code style)
        run: vendor/bin/pint --test
      - name: Larastan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

  tests:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*']
        testbench: ['10.*']
        experimental: [false]
        include:
          # Laravel 13 leg — allowed to fail until the ecosystem
          # (testbench 11, Fortify, Spatie peers) fully lands.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            experimental: true

    continue-on-error: ${{ matrix.experimental }}
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, bcmath, intl, fileinfo
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # The job the unit suite can't replace: a REAL fresh Laravel 12 app,
  # path-repo install of the kit, full module install, npm build,
  # route:cache, doctor, and HTTP smoke. Catches missing-route 500s,
  # duplicate route names, and frontend-build breakage.
  fresh-app:
    runs-on: ubuntu-latest
    needs: lint
    name: Fresh Laravel 12 end-to-end
    steps:
      - name: Checkout kit
        uses: actions/checkout@v4
        with:
          path: kit

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, intl, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create fresh Laravel 12 app
        run: composer create-project laravel/laravel:^12.0 app --no-interaction --prefer-dist

      - name: Require the kit from the local path
        working-directory: app
        run: |
          composer config repositories.ui-kit path ../kit
          composer require "shipbytes/laravel-ui-kit:@dev" --no-interaction

      - name: Run the installer with every module
        working-directory: app
        run: php artisan ui-kit:install --modules=all --no-interaction

      - name: Installer must have applied the User trait automatically
        working-directory: app
        run: |
          grep -q 'UiKitUser' app/Models/User.php
          php -l app/Models/User.php

      - name: Build frontend assets
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Route cache must survive (duplicate-name regression net)
        working-directory: app
        run: |
          php artisan route:cache
          php artisan route:clear

      - name: Kit health check
        working-directory: app
        run: php artisan ui-kit:doctor

      - name: make-admin promotes a user (Spatie role path)
        working-directory: app
        run: |
          php artisan tinker --execute="App\Models\User::forceCreate(['name' => 'CI Admin', 'email' => 'ci@example.com', 'password' => bcrypt('secret-ci-pass')]);"
          php artisan ui-kit:make-admin ci@example.com
          php artisan tinker --execute="exit(App\Models\User::first()->hasRole('admin') && App\Models\User::first()->is_admin ? 0 : 1);"

      - name: HTTP smoke
        working-directory: app
        run: |
          php artisan serve --port=8787 &
          sleep 3
          set -e
          curl -fsS http://127.0.0.1:8787/login | grep -q "Welcome back"
          curl -fsS http://127.0.0.1:8787/register | grep -q "Create your account"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/admin)
          test "$code" = "302" || { echo "/admin expected 302 for guests, got $code"; exit 1; }
          curl -fsS http://127.0.0.1:8787/ > /dev/null
          echo "smoke OK"
